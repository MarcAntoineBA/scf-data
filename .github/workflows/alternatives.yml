name: Candidats de remplacement

# Cherche un remplaçant aux trois sources qui refusent les IP cloud (Binance,
# Farside, Investing). Se lance à la demande et quand la liste des candidats change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/probe_alternatives.py

permissions:
  contents: write

jobs:
  alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet curl_cffi
      - env:
          SCF_PROBE_OUT: sonde/alternatives.json
        run: |
          mkdir -p sonde
          python tools/probe_alternatives.py
      - name: Publier le verdict
        if: always()
        run: |
          git config user.name  "sonde"
          git config user.email "sonde@users.noreply.github.com"
          git add sonde/
          git diff --cached --quiet && exit 0
          git commit -q -m "candidats de remplacement : verdict du $(date -u '+%F %H:%M UTC')"
          git pull --rebase --autostash origin main && git push
