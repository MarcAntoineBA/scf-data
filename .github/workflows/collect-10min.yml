name: Collecte 10min

# Cadence : toutes les 10 minutes. Le déclencheur manuel sert aux vérifications ponctuelles.
# NB : GitHub exécute les tâches planifiées « au mieux » — quelques minutes de retard
# aux heures de pointe sont normales. C'est sans commune mesure avec les 10 à 19 heures
# de gel que produisait une machine endormie.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

# Deux exécutions de la même cadence ne doivent jamais se chevaucher : elles
# écriraient les mêmes fichiers. La nouvelle attend son tour plutôt que d'annuler
# l'autre — une collecte à moitié faite vaut moins qu'une collecte finie.
concurrency:
  group: collecte-10min
  cancel-in-progress: false

jobs:
  collecte:
    uses: ./.github/workflows/_collect.yml
    with:
      bucket: 10min
    secrets: inherit
