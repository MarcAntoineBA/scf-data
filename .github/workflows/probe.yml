name: Sonde des sources

# Répond à la seule question qui décide de la migration hors du Mac :
# les sources du site répondent-elles depuis une IP de datacenter ?
# On la relance chaque jour : une source peut se fermer aux IP cloud du jour au
# lendemain, et il vaut mieux l'apprendre par ce tableau que par un widget figé.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC, hors des heures de pointe des runners
  push:
    # La sonde se relance dès qu'on touche à ce qu'elle mesure — et au premier envoi,
    # ce qui donne le verdict sans attendre le prochain créneau.
    branches: [main]
    paths:
      - tools/probe_sources.py
      - .github/workflows/probe.yml

permissions:
  contents: write   # le verdict est publié dans le dépôt, pas seulement en artefact

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # curl_cffi = usurpation TLS chrome120, indispensable à Yahoo. Sans elle,
      # un 403 dirait « IP bloquée » alors qu'il ne dirait que « client non déguisé ».
      - name: Dépendances
        run: pip install --quiet curl_cffi

      - name: Sonder
        env:
          SCF_PROBE_LABEL: runner GitHub (IP datacenter)
          SCF_PROBE_OUT: probe_runner.json
        run: python tools/probe_sources.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonde-runner
          path: probe_runner.json
          retention-days: 30

      # Un artefact ne se télécharge qu'authentifié, et expire. Le verdict est le
      # document qui décide de la migration : il doit rester lisible par tous, et
      # comparable d'un jour à l'autre — donc versionné, pas rangé dans un tiroir.
      - name: Publier le verdict
        if: always()
        run: |
          mkdir -p sonde && mv probe_runner.json sonde/dernier.json
          git config user.name  "sonde"
          git config user.email "sonde@users.noreply.github.com"
          git add sonde/
          git diff --cached --quiet && { echo "verdict inchangé"; exit 0; }
          git commit -q -m "sonde : verdict du $(date -u '+%F %H:%M UTC')"
          git pull --rebase --autostash origin main && git push
