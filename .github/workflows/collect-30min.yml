name: Collecte 30min

# Cadence : toutes les 30 minutes. Le déclencheur manuel sert aux vérifications ponctuelles.
# NB : GitHub exécute les tâches planifiées « au mieux » — quelques minutes de retard
# aux heures de pointe sont normales. C'est sans commune mesure avec les 10 à 19 heures
# de gel que produisait une machine endormie.

on:
  workflow_dispatch:
  # Déclencheur temporaire : force une VRAIE collecte au premier envoi, sans attendre
  # que GitHub active les plannings d'un dépôt neuf. À retirer une fois la migration
  # validée — sinon chaque correction de collecteur relancerait un lot complet.
  push:
    branches: [main]
    paths: [tools/run_jobs.py]
  schedule:
    - cron: "*/30 * * * *"

# Deux exécutions de la même cadence ne doivent jamais se chevaucher : elles
# écriraient les mêmes fichiers. La nouvelle attend son tour plutôt que d'annuler
# l'autre — une collecte à moitié faite vaut moins qu'une collecte finie.
concurrency:
  group: collecte-30min
  cancel-in-progress: false

jobs:
  collecte:
    uses: ./.github/workflows/_collect.yml
    with:
      bucket: 30min
    secrets: inherit
