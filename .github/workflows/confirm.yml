name: Confirmation des sources douteuses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe_confirm.py]

permissions:
  contents: write

jobs:
  confirmer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet curl_cffi
      # Le résumé d'exécution ne se lit qu'authentifié : le verdict est aussi écrit
      # dans le dépôt, où il reste consultable et comparable dans le temps.
      - run: |
          mkdir -p sonde
          python tools/probe_confirm.py | tee sonde/confirmation.txt
          cat sonde/confirmation.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publier
        if: always()
        run: |
          git config user.name  "sonde"
          git config user.email "sonde@users.noreply.github.com"
          git add sonde/
          git diff --cached --quiet && exit 0
          git commit -q -m "confirmation des sources : $(date -u '+%F %H:%M UTC')"
          git pull --rebase --autostash origin main && git push
